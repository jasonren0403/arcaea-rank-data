name: 'Daily Autofetch Job'

on: 
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'  # 0:45 every day(UTC)

jobs:
  main_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check public IP
        uses: haythem/public-ip@v1.3
      - name: Do the run
        run: python main.py
      - name: Commit changes
        # https://github.com/stefanzweifel/git-auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Apply automatic data changes
