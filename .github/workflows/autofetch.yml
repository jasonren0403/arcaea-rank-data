name: 'Daily Autofetch Job'

env:
  CI: true

on: 
  workflow_dispatch:
  schedule:
    - cron: '25,50 0-10/2 * * *'

jobs:
  file_check:
    name: File Check
    runs-on: ubuntu-latest
    outputs:
      file_already_exists: ${{ steps.file_check.outputs.flag }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Check file exists
        id: file_check
        run: |
          python filecheck.py
  main_job:
    name: Download and update assets
    runs-on: ubuntu-latest
    needs: file_check
    if: needs.file_check.outputs.file_already_exists == 'False'
    env:
      PAID_DATA_ERRORED: 'false'
      FREE_DATA_ERRORED: 'false'
      IP_CHECK_COUNT: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check public IP
        uses: haythem/public-ip@v1.3
      - name: Do the run
        run: python main.py
      - name: echo PAID_DATA_ERRORED
        run: printf 'PAID_DATA_ERRORED = %s\n' "$PAID_DATA_ERRORED"
      - name: echo FREE_DATA_ERRORED
        run: printf 'FREE_DATA_ERRORED = %s\n' "$FREE_DATA_ERRORED"
      - name: Commit changes
        if: env.PAID_DATA_ERRORED == 'false' && env.FREE_DATA_ERRORED == 'false'
        # https://github.com/stefanzweifel/git-auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Apply automatic data changes
